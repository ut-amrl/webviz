<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* Bootstrap covers the rest; only retain things Bootstrap does not. */
    #canvas {
      background: #fff;
      width: 100%;
      height: 70vh;
      user-select: none;
      outline: none;
    }

    .panel-image {
      width: 100%;
      max-height: 30vh;
      object-fit: contain;
      background: #f0f0f0;
    }

    /* Chat transcript: thinking bubbles align left (muted, italic) and
       lead the turn, motion bubbles align left, critic bubbles right.
       Bubbles are intentionally narrow so long completions wrap cleanly. */
    #chatHistory {
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .chat-bubble {
      max-width: 85%;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.8rem;
      line-height: 1.25;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .chat-bubble-thinking {
      background: #f3f4f6;
      color: #495057;
      align-self: flex-start;
      font-style: italic;
    }

    .chat-bubble-motion {
      background: #e7f1ff;
      color: #0b3d91;
      align-self: flex-start;
    }

    .chat-bubble-critic {
      background: #f4e7ff;
      color: #4a148c;
      align-self: flex-end;
    }

    .chat-bubble-user {
      background: #e2e3e5;
      color: #212529;
      align-self: center;
      font-weight: 500;
      max-width: 95%;
    }

    .chat-thumb {
      width: 100%;
      max-height: 18vh;
      object-fit: contain;
      background: #ffffff;
      border-radius: 4px;
      margin-top: 4px;
    }

    .chat-meta {
      font-size: 0.7rem;
      opacity: 0.75;
      margin-bottom: 2px;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container-fluid py-2">
    <h4 class="mb-2">UT AUTOmata Web Interface</h4>

      </div>

  <script type="text/javascript" type="text/javascript">
    var canvas = document.getElementById("canvas");
    var visMsg = undefined;
    var scale = 20;
    var origin = { x: 0.5 * canvas.width, y: 0.5 * canvas.height };
    var prev_origin = { x: 0, y: 0 };
    var ctx = canvas.getContext("2d");
    ctx.textAlign = "end";
    ctx.textBaseline = "top";
    var mouseDownLoc;
    var curMouseLoc;
    var mouseDown = false;
    var setLocation = false;
    var setNavGoal = false;
    var setWaypoints = false;
    var resetNavGoals = false;
    var coords = document.getElementById("coords");
    var mapList = document.getElementById("map");
    var robotPose = undefined;
    var tLastDraw = 0;
    var map = [];
    var lastLaserScan = undefined;
    var robot_interface = undefined;
    var currentMapName = '';

    try {
      if (window.localStorage.getItem('ipaddr')) {
        document.getElementById('ipaddr').value =
          window.localStorage.getItem('ipaddr');
      }
      if (window.localStorage.getItem('port')) {
        document.getElementById('port').value =
          window.localStorage.getItem('port');
      }
      if (window.localStorage.getItem('laserOffset')) {
        document.getElementById('laserOffset').value =
          window.localStorage.getItem('laserOffset');
      }
      if (window.localStorage.getItem('updateRate')) {
        document.getElementById('updateRate').value =
          window.localStorage.getItem('updateRate');
      }
      if (window.localStorage.getItem('positionThreshold')) {
        document.getElementById('positionThreshold').value =
          window.localStorage.getItem('positionThreshold');
      }
      if (window.localStorage.getItem('orientationThreshold')) {
        document.getElementById('orientationThreshold').value =
          window.localStorage.getItem('orientationThreshold');
      }
      if (window.localStorage.getItem('waypointPause')) {
        document.getElementById('waypointPause').value =
          window.localStorage.getItem('waypointPause');
      }
      if (window.localStorage.getItem('chatHistoryTurns')) {
        document.getElementById('chatHistoryTurns').value =
          window.localStorage.getItem('chatHistoryTurns');
      }
    } catch (e) {
      updateStatus('Unable to access localstorage, settings will not be saved');
    }
    function resizeCanvasToContainer() {
      const parent = canvas.parentElement;
      if (!parent) return;
      const newWidth = parent.clientWidth;
      const newHeight = Math.max(400, Math.round(window.innerHeight * 0.7));
      const widthChanged = canvas.width !== newWidth;
      const heightChanged = canvas.height !== newHeight;
      canvas.width = newWidth;
      canvas.height = newHeight;
      if (widthChanged || heightChanged) {
        origin = { x: 0.5 * canvas.width, y: 0.5 * canvas.height };
      }
    }
    resizeCanvasToContainer();
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => resizeCanvasToContainer());
      ro.observe(canvas.parentElement);
    } else {
      window.addEventListener('resize', resizeCanvasToContainer);
    }
    canvas.addEventListener('wheel', onMouseScroll, false);
    window.addEventListener("keypress", onKeyPress, false);
    canvas.onmouseup = onMouseUp;
    canvas.onmousedown = onMouseDown;
    canvas.onmousemove = onMouseMove;
    changeMap();

    class DataParser {
      constructor(arrayBuffer) {
        this.header = {
          num_points: 0,
          num_lines: 0,
          num_arcs: 0,
          num_text_annotations: 0,
          num_laser_rays: 0,
          num_local_points: 0,
          num_local_lines: 0,
          num_local_arcs: 0,
          num_local_text_annotations: 0,
          laser_min_angle: 0,
          laser_max_angle: 0,
          robot_pose: { x: NaN, y: NaN, theta: NaN },
          map: ''
        };

        this.length = arrayBuffer.byteLength;
        this.remainingBytes = this.length;
        this.dataView = new DataView(arrayBuffer, 0);
        this.offset = 0;
        this.littleEndian = true;
        // The first 4 bytes are the encoded number '42'.
        // If the data is littleEndian the first byte should not be 0.
        if (arrayBuffer[0] === 0) {
          this.littleEndian = false;
        }
        this.offset += 4;
        this.remainingBytes -= 4;
      }

      readUint8() {
        let x = this.dataView.getUint8(this.offset, this.littleEndian);
        this.offset += 1;
        this.remainingBytes -= 1;
        return x;
      }

      readUint32() {
        let x = this.dataView.getUint32(this.offset, this.littleEndian);
        this.offset += 4;
        this.remainingBytes -= 4;
        return x;
      }

      readUint16() {
        let x = this.dataView.getUint16(this.offset, this.littleEndian);
        this.offset += 2;
        this.remainingBytes -= 2;
        return x;
      }

      readFloat32() {
        let x = this.dataView.getFloat32(this.offset, this.littleEndian);
        this.offset += 4;
        this.remainingBytes -= 4;
        return x;
      }

      readString() {
        let s = '';
        let end_of_str = false;
        for (let i = 0; i < 32; i++) {
          const c = this.readUint8();
          if (c == 0 || end_of_str) {
            end_of_str = true;
          } else {
            s += String.fromCharCode(c)
          }
        }
        return s;
      }

      readHeader() {
        this.header.num_points = this.readUint32();
        this.header.num_lines = this.readUint32();
        this.header.num_arcs = this.readUint32();
        this.header.num_text_annotations = this.readUint32();
        this.header.num_laser_rays = this.readUint32();
        this.header.num_local_points = this.readUint32();
        this.header.num_local_lines = this.readUint32();
        this.header.num_local_arcs = this.readUint32();
        this.header.num_local_text_annotations = this.readUint32();
        this.header.laser_min_angle = this.readFloat32();
        this.header.laser_max_angle = this.readFloat32();
        this.header.robot_pose = this.readPose();
        this.header.map = this.readString();
        return this.header;
      }

      readPose() {
        let pose = {
          x: 0,
          y: 0,
          theta: 0
        };
        pose.x = this.readFloat32();
        pose.y = this.readFloat32();
        pose.theta = this.readFloat32();
        return pose;
      }

      readMultiple(n, reader) {
        let arr = [];
        for (let i = 0; i < n; ++i) {
          arr.push(reader());
        }
        return arr;
      }

      readLaser() {
        let laser = {
          angle_min: this.header.laser_min_angle,
          angle_max: this.header.laser_max_angle,
          ranges: this.readMultiple(this.header.num_laser_rays, () => this.readUint32())
        }
        for (let i = 0; i < laser.ranges.length; ++i) {
          laser.ranges[i] = 0.001 * laser.ranges[i];
        }
        return laser;
      }

      readColor() {
        const c = this.readUint32();
        const a = Math.abs((c & 0xFF000000) >> 24);
        const r = (c & 0xFF0000) >> 16;
        const g = (c & 0xFF00) >> 8;
        const b = c & 0xFF;
        if (a > 0) {
          return `rgba(${r},${g},${b},${a / 255})`;
        } else {
          return `rgb(${r},${g},${b})`;
        }

      }

      readPoint2D() {
        return {
          x: this.readFloat32(),
          y: this.readFloat32()
        };
      }

      readPoint() {
        return {
          point: this.readPoint2D(),
          color: this.readColor()
        };
      }

      readLine() {
        return {
          p0: this.readPoint2D(),
          p1: this.readPoint2D(),
          color: this.readColor()
        };
      }

      readArc() {
        return {
          center: this.readPoint2D(),
          radius: this.readFloat32(),
          start_angle: this.readFloat32(),
          end_angle: this.readFloat32(),
          color: this.readColor()
        };
      }

      readTextMessage() {
        return {
          start: this.readPoint2D(),
          color: this.readColor(),
          size_em: this.readFloat32(),
          str: this.readString()
        }
      }

      readMessage() {
        let message = {
          header: this.readHeader(),
          laser: this.readLaser(),
          points: this.readMultiple(this.header.num_points, () => this.readPoint()),
          lines: this.readMultiple(this.header.num_lines, () => this.readLine()),
          arcs: this.readMultiple(this.header.num_arcs, () => this.readArc()),
          textAnnotations: this.readMultiple(this.header.num_text_annotations, () => this.readTextMessage()),
          robotPose: undefined
        }
        message.robotPose = message.header.robot_pose;
        return message;
      }
    };

    // Parses a binary image frame matching the layout in websocket.cc:
    //   uint32 nonce, uint32 panel_id, uint32 topic_str_len, uint32 jpeg_len,
    //   double stamp_sec, char[topic_str_len] topic, uint8[jpeg_len] jpeg.
    class ImageFrameParser {
      constructor(arrayBuffer) {
        this.dataView = new DataView(arrayBuffer, 0);
        this.bytes = new Uint8Array(arrayBuffer);
        this.offset = 0;
      }

      readImageFrame() {
        const nonce = this.dataView.getUint32(this.offset, true); this.offset += 4;
        const panel_id = this.dataView.getUint32(this.offset, true); this.offset += 4;
        const topic_len = this.dataView.getUint32(this.offset, true); this.offset += 4;
        const jpeg_len = this.dataView.getUint32(this.offset, true); this.offset += 4;
        const stamp_sec = this.dataView.getFloat64(this.offset, true); this.offset += 8;
        const topic = new TextDecoder('utf-8').decode(
          this.bytes.subarray(this.offset, this.offset + topic_len));
        this.offset += topic_len;
        const jpegBytes = this.bytes.subarray(
          this.offset, this.offset + jpeg_len);
        return { nonce, panel_id, topic, stamp_sec, jpegBytes };
      }
    };

    class RobotInterface {
      // Constructor: set up callbacks.
      constructor() {
        this.socket = null;
        this.waypoints = []; // list of tuples (x, y, theta) waypoints
        // Set up callbacks.
        this.callbacks = {
          onopen: null,
          onReceiveRobotData: null,
          onReceiveImageFrame: null,
          onReceiveJSON: null,
          onerror: null,
          onclose: null
        };
      }

      onopen(event) {
        console.log(`Connected to ${this.socket.url}`);
        if (this.callbacks.onopen) this.callbacks.onopen(event);
      }

      onReceiveRobotData(data) {
        // Peek the leading uint32 nonce to choose between vis (kVisNonce, 42)
        // and image (kImageNonce, 43) binary frames.
        const VIS_NONCE = 42;
        const IMAGE_NONCE = 43;
        if (data.byteLength < 4) return;
        const view = new DataView(data, 0);
        const nonce = view.getUint32(0, true);
        if (nonce === VIS_NONCE) {
          let parser = new DataParser(data);
          let message = parser.readMessage();
          if (this.callbacks.onReceiveRobotData) {
            this.callbacks.onReceiveRobotData(message);
          }
        } else if (nonce === IMAGE_NONCE) {
          let parser = new ImageFrameParser(data);
          let frame = parser.readImageFrame();
          if (this.callbacks.onReceiveImageFrame) {
            this.callbacks.onReceiveImageFrame(frame);
          }
        } else {
          console.warn(`Unknown binary frame nonce: ${nonce}`);
        }
      }

      onmessage(event) {
        if (typeof (event.data) === "string" &&
          this.callbacks.onReceiveJSON) {
          this.callbacks.onReceiveJSON(JSON.parse(event.data));
        } else if (typeof (event.data) === "object" &&
          this.callbacks.onReceiveRobotData) {
          new Response(event.data).arrayBuffer().then(
            (data) => this.onReceiveRobotData(data)
          );
        } else {
          console.error(`Unknown data type: ${typeof (event.data)}`);
        }
      }

      onclose(e) {
        if (event.wasClean) {
          console.log(`[close] Connection closed cleanly, code=${event.code} reason=${event.reason}`);
        } else {
          // e.g. server process killed or network down
          // event.code is usually 1006 in this case
          console.log('[close] Connection died');
        }
        if (this.callbacks.onclose) this.callbacks.onclose(e);
        this.socket = null;
        close();
      }

      onerror(error) {
        console.log(`[error] ${error.message}`);
        if (this.callbacks.onerror) this.callbacks.onerror(e);
      }

      // Connect to a host.
      connect(hostname, callbacks) {
        this.callbacks = callbacks;
        // Create ws.
        if (this.socket) {
          console.error(`Error: Already connected to ${this.socket.url}`);
          return;
        }
        try {
          // Extract hostname and port if provided together
          let [host, port] = hostname.includes(':') ? hostname.split(':') : [hostname, '10272'];
          this.socket = new WebSocket("ws://" + host + ":" + port);
        } catch (error) {
          this.onerror(error);
          return;
        }
        this.socket.onopen = (e) => this.onopen(e);
        this.socket.onmessage = (e) => this.onmessage(e);
        this.socket.onclose = (e) => this.onclose(e);
        this.socket.onerror = (e) => this.onerror(e);
      }

      // Send initial pose message.
      setInitialPose(x, y, theta) {
        if (!this.socket) {
          console.error('Error: not connected');
          return;
        }
        this.socket.send(JSON.stringify({
          type: "set_initial_pose",
          x: x,
          y: y,
          theta: theta,
          map: currentMapName
        }));
      }

      // Send navigation target.
      setNavGoal(x, y, theta) {
        if (!this.socket) {
          console.error('Error: not connected');
          return;
        }
        this.socket.send(JSON.stringify({
          type: "set_nav_goal",
          x: x,
          y: y,
          theta: theta,
          map: currentMapName
        }));
      }

      // Reset all navgoals and waypoints.
      resetNavGoals() {
        this.waypoints = [];
        if (!this.socket) {
          console.error('Error: not connected');
          return;
        }
        this.socket.send(JSON.stringify({
          type: "reset_nav_goals"
        }));
      }

      // Send waypoint.
      async gotoWaypoint(idx) {
        console.log(`%cEntered gotoWaypoint for index ${idx}`, 'color: blue;');
        this.setNavGoal(this.waypoints[idx][0], this.waypoints[idx][1], this.waypoints[idx][2]);
        while (true) {
          if (resetNavGoals) {
            break;
          }
          if (comparePoses([robotPose.x, robotPose.y, robotPose.theta], this.waypoints[idx])) {
            console.log('Reached the waypoint');
            break; // Exit the loop if the robot has reached the waypoint.
          }
          await new Promise(resolve => setTimeout(resolve, 100)); // Wait for 100 ms.
        }
      }

      async gotoWaypoints() {
        console.log('%cEntered gotoWaypoints', 'color: green; font-weight: bold;');
        for (let i = 0; i < this.waypoints.length; i++) {
          await this.gotoWaypoint(i);
          if (resetNavGoals) {
            break;
          }
          const waypointPause = parseFloat(document.getElementById('waypointPause').value) || 15.0;
          console.log(`%cAwaiting ${waypointPause} seconds at waypoint ${i}`, 'color: gray;');
          await new Promise(resolve => setTimeout(resolve, waypointPause * 1000)); // Wait for configured seconds.
          if (i == this.waypoints.length - 1) {
            console.log('%cLooping to start of waypoints array', 'color: pink; font-weight: bold;');
            i = -1;
          }
        }
      }

      close() {
        if (!this.socket) return;
        this.socket.close();
        this.socket = null;
      }
    };

    function loadMap(mapName) {
      let found = false;
      for (var opt, j = 0; opt = mapList.options[j]; j++) {
        if (opt.value == mapName) {
          mapList.selectedIndex = j;
          found = true;
          break;
        }
      }
      if (!found) {
        let opt = document.createElement('option');
        // opt.appendChild(document.createTextNode(mapName));
        opt.value = mapName;
        opt.innerHTML = mapName;
        mapList.appendChild(opt);
        mapList.selectedIndex = mapList.options.length - 1;
      }
      let url = `https://amrl.cs.utexas.edu/amrl_maps/${mapName}/${mapName}.vectormap.json`;
      // for other branches:
      // let url = `https://raw.githubusercontent.com/ut-amrl/amrl_maps/${branchName}/${mapName}/${mapName}.vectormap.json`;
      console.log(`Loading "${url}"`);
      var xhr = new XMLHttpRequest();
      // xhr.responseType = 'json';
      xhr.onload = function () {
        var status = xhr.status;
        if (status === 200) {
          try {
            map = JSON.parse(xhr.response);
          } catch (e) {
            console.error(`Error parsing map: ${e}`);
            map = [];
            return;
          }
          console.log(`Loaded map "${mapName}"`);
        } else {
          console.log(`Error loading map "${mapName}"`);
        }
      };
      xhr.open('GET', url, true);
      xhr.send();
    }

    function comparePoses(pose1, pose2) {
      const [x1, y1, theta1] = pose1;
      const [x2, y2, theta2] = pose2;
      const positionThreshold = parseFloat(document.getElementById('positionThreshold').value) || 0.7;
      const orientationThreshold = parseFloat(document.getElementById('orientationThreshold').value) || 3.0;

      x_ = Math.abs(x1 - x2);
      y_ = Math.abs(y1 - y2);
      theta_ = Math.abs(theta1 - theta2);
      // console.log(`%cx_: ${x_}, y_: ${y_}, theta_: ${theta_}`, 'color: gray;');
      return (x_ < positionThreshold && y_ < positionThreshold && theta_ < orientationThreshold);
    }

    // Get the "true" mouse location, compensting for scroll, zoom, etc.
    function getMouseLocation(event, element) {
      var posx = 0;
      var posy = 0;
      if (!event) var event = window.event;
      if (event.pageX || event.pageY) {
        posx = event.pageX;
        posy = event.pageY;
      } else if (event.clientX || event.clientY) {
        posx = event.clientX + document.body.scrollLeft
          + document.documentElement.scrollLeft;
        posy = event.clientY + document.body.scrollTop
          + document.documentElement.scrollTop;
      }
      if (element != undefined &&
        isFinite(element.offsetLeft) &&
        isFinite(element.offsetTop)) {
        posx -= element.offsetLeft;
        posy -= element.offsetTop;
      }
      return ({ x: posx, y: posy });
    }

    function canvasToWorld(p) {
      return {
        x: (p.x - origin.x) / scale,
        y: (origin.y - p.y) / scale
      };
    }

    function worldToCanvas(p) {
      return {
        x: p.x * scale + origin.x,
        y: origin.y - p.y * scale
      };
    }

    function onMouseMove(event) {
      curMouseLoc = getMouseLocation(event, canvas);
      w = canvasToWorld(curMouseLoc);
      const x_str = w.x.toFixed(3);
      const y_str = w.y.toFixed(3);
      coords.innerHTML = `x=${x_str}, y=${y_str}`;
      if (!mouseDown) return;
      if (setLocation || setNavGoal || setWaypoints) return;
      origin.x = prev_origin.x + curMouseLoc.x - mouseDownLoc.x;
      origin.y = prev_origin.y + curMouseLoc.y - mouseDownLoc.y;
    };

    function onMouseDown(event) {
      mouseDownLoc = getMouseLocation(event, canvas);
      mouseDown = true;
      prev_origin = { x: origin.x, y: origin.y };
      if (event.ctrlKey) {
        setNavGoal = true;
      } else if (event.shiftKey) {
        setLocation = true;
      }
    };

    function onMouseUp(event) {
      let loc = getMouseLocation(event, canvas);
      let w = canvasToWorld(loc);
      if (setNavGoal) {
        // Set nav target here.
        if (robot_interface) {
          let w0 = canvasToWorld(mouseDownLoc);
          let a = Math.atan2(mouseDownLoc.y - loc.y, loc.x - mouseDownLoc.x);
          robot_interface.setNavGoal(w0.x, w0.y, a);
        }
      } else if (setLocation) {
        // Set localization here.
        if (robot_interface) {
          let w0 = canvasToWorld(mouseDownLoc);
          let a = Math.atan2(mouseDownLoc.y - loc.y, loc.x - mouseDownLoc.x);
          robot_interface.setInitialPose(w0.x, w0.y, a);
        }
      } else if (setWaypoints) {
        // Set waypoints here.
        if (robot_interface) {
          let w0 = canvasToWorld(mouseDownLoc);
          let a = Math.atan2(mouseDownLoc.y - loc.y, loc.x - mouseDownLoc.x);
          robot_interface.waypoints.push([w0.x, w0.y, a]);
        }
      } else {
        // Pan.
        origin.x = prev_origin.x + loc.x - mouseDownLoc.x;
        origin.y = prev_origin.y + loc.y - mouseDownLoc.y;
        prev_origin = origin;
      }
      setNavGoal = false;
      setLocation = false;
      mouseDown = false;
      document.getElementById("setLocation").classList.remove('active');
      document.getElementById("setNavGoal").classList.remove('active');
    }

    function onMouseScroll(event) {
      let loc = getMouseLocation(event, canvas);
      let s1 = scale;
      if (event.deltaY > 0) {
        scale *= 0.95;
        //
      } else if (event.deltaY < 0) {
        scale *= 1.05;
      }
      let s2 = scale;
      origin.x = loc.x * (s1 - s2) / s1 + s2 / s1 * origin.x;
      origin.y = loc.y * (s1 - s2) / s1 + s2 / s1 * origin.y;
      event.preventDefault();
      return false;
    }

    function drawPoint(color, x, y) {
      ctx.fillStyle = color;
      const p = worldToCanvas({ x: x, y: y });
      ctx.fillRect(p.x, p.y, 2, 2);
    }

    function drawLine(color, x1, y1, x2, y2) {
      ctx.strokeStyle = color;
      ctx.beginPath();
      const p1 = worldToCanvas({ x: x1, y: y1 });
      const p2 = worldToCanvas({ x: x2, y: y2 });
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    function drawTextAnnotation(text, x, y, color, size_em) {

    // Tracks the previously-issued blob URL per panel so we can revoke it
    // after assigning a new one. Without this, every frame leaks memory.
    var imagePanelObjectURLs = { 0: null, 1: null };

    function panelIdToImgElement(panelId) {
      if (panelId === 0) return document.getElementById('imgLeft');
      if (panelId === 1) return document.getElementById('imgRight');
      return null;
    }

    function setPanelImage(panelId, jpegBytes) {
      const img = panelIdToImgElement(panelId);
      if (!img) return;
      const blob = new Blob([jpegBytes], { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      const previous = imagePanelObjectURLs[panelId];
      img.src = url;
      imagePanelObjectURLs[panelId] = url;
      if (previous) URL.revokeObjectURL(previous);
    }

    function setForesightStatus(text, reflectionId) {

    // Chat transcript: thinking / motion (left) and critic (right) bubbles
    // accumulate across planning iterations and across graph_navigation
    // auto-replans. The conversation persists until the user starts a new
    // language command (sendForesightCommand) or hits reset
    // (sendResetNavGoals); both call clearChatHistory(). We intentionally
    // do NOT dedup or auto-reset on header.stamp because graph_navigation
    // will keep retriggering the planner with fresh stamps for the same
    // mission, and each replan is a legitimate new entry in the chat.

    function chatHistoryMaxTurns() {
      const v = parseInt(
        document.getElementById('chatHistoryTurns').value, 10);
      return (Number.isFinite(v) && v > 0) ? v : 8;
    }

    function clearChatHistory() {
      const root = document.getElementById('chatHistory');
      while (root.firstChild) root.removeChild(root.firstChild);
    }

    function trimChatHistoryToMax() {
      const root = document.getElementById('chatHistory');
      const maxBubbles = chatHistoryMaxTurns();
      while (root.children.length > maxBubbles) {
        root.removeChild(root.firstChild);
      }
    }

    function appendChatBubble(kind, headerHtml, bodyText, imageB64) {
      const root = document.getElementById('chatHistory');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble chat-bubble-${kind}`;
      if (headerHtml) {
        const hdr = document.createElement('div');
        hdr.className = 'chat-meta';
        hdr.innerHTML = headerHtml;
        bubble.appendChild(hdr);
      }
      if (bodyText) {
        const body = document.createElement('div');
        body.textContent = bodyText;
        bubble.appendChild(body);
      }
      if (imageB64) {
        const img = document.createElement('img');
        img.className = 'chat-thumb';
        img.alt = 'motion plan image';
        img.src = `data:image/jpeg;base64,${imageB64}`;
        bubble.appendChild(img);
      }
      root.appendChild(bubble);
      trimChatHistoryToMax();
      root.scrollTop = root.scrollHeight;
    }

    function appendUserBubble(text) {
      appendChatBubble('user', 'goal', text, null);
    }

    function appendThinkingBubble(reflectionId, text) {
      const meta = `thinking &middot; refl ${reflectionId}`;
      appendChatBubble('thinking', meta, text, null);
    }

    function appendMotionBubble(reflectionId, text, imageB64) {
      const meta = `motion &middot; refl ${reflectionId}`;
      appendChatBubble('motion', meta, text, imageB64);
    }

    function appendCriticBubble(reflectionId, text, verdict, reason) {
      const verdictLabel = verdict === 'true' ? 'PASS'
        : verdict === 'false' ? 'FAIL'
          : '';
      const verdictClass = verdict === 'true' ? 'bg-success'
        : verdict === 'false' ? 'bg-danger'
          : 'bg-secondary';
      const pill = verdictLabel
        ? `<span class="badge ${verdictClass} ms-1">${verdictLabel}</span>`
        : '';
      const meta = `critic &middot; refl ${reflectionId}${pill}`;
      // Prefer the parsed reason for readability, but fall back to the raw
      // critic completion when the planner could not parse it.
      const body = (reason && reason.length > 0) ? reason : (text || '');
      appendChatBubble('critic', meta, body, null);
    }

    function sendForesightCommand() {
      if (!robot_interface || !robot_interface.socket) {
        setForesightStatus('not connected');
        return;
      }
      const input = document.getElementById('foresightInput');
      const text = input.value.trim();
      if (!text) return;
      robot_interface.socket.send(JSON.stringify({
        type: 'foresight_command',
        text: text,
      }));
      setForesightStatus('sending...', 0);
      clearChatHistory();
      appendUserBubble(text);
    }

    function sendResetNavGoals() {
      if (!robot_interface || !robot_interface.socket) {
        setForesightStatus('not connected');
        return;
      }
      robot_interface.socket.send(JSON.stringify({
        type: 'reset_nav_goals',
      }));
      setForesightStatus('reset', 0);
      clearChatHistory();
    }

    function onForesightResponse(json) {
      const state = json.state || '';
      const reflectionId =
        typeof json.reflection_id === 'number' ? json.reflection_id : 0;
      setForesightStatus(state || 'unknown', reflectionId);
      // The "sent" echo from HandleForesightCommand carries no chat content;
      // skip emitting bubbles for it.
      if (state === 'sent') return;

      const thinkingText = json.thinking_text || '';
      const motionText = json.motion_text || '';
      const motionImg = json.motion_image_b64 || '';
      const criticText = json.critic_text || '';
      const verdict = json.verdict || '';
      const reason = json.reason || '';

      // Render bubbles in fixed conversation order (thinking -> motion ->
      // critic). Each section is independently gated on having content, so
      // ECoT (thinking + motion), reflect (motion + critic), or full
      // (thinking + motion + critic) flows all render correctly. The
      // thinking trace is only populated on refl=0 by the planner. Bubbles
      // accumulate across iterations and across graph_navigation replans;
      // the chat is only cleared by an explicit user action (new language
      // command or reset nav goals).
      if (thinkingText) {
        appendThinkingBubble(reflectionId, thinkingText);
      }
      if (motionText || motionImg) {
        appendMotionBubble(reflectionId, motionText, motionImg);
      }
      if (criticText || reason || verdict) {
        appendCriticBubble(reflectionId, criticText, verdict, reason);
      }
    }

    function processJsonData(json) {
      if (json && json.type === 'foresight_response') {
        onForesightResponse(json);

        return;
      }
      console.log('Received JSON:', json);
    }

    function drawMap() {
      ctx.lineWidth = 1;
      map.forEach(function (l) {
        drawLine("#319bd4", l.p0.x, l.p0.y, l.p1.x, l.p1.y);
      });

    function drawPose(p, color) {
      const l = 0.5;
      const h = 0.1;
      const a = p.theta;
      const dir = { x: Math.cos(a), y: Math.sin(a) };
      const perp = { x: -dir.y, y: dir.x };
      const p0 = p;
      const p1 = { x: p0.x + l * dir.x, y: p0.y + l * dir.y };
      const p2 = {
        x: p1.x + h * (-dir.x + perp.x),
        y: p1.y + h * (-dir.y + perp.y)
      };
      const p3 = {
        x: p1.x + h * (-dir.x - perp.x),
        y: p1.y + h * (-dir.y - perp.y)
      };
      const kPoseColor = color;
      drawLine(kPoseColor, p0.x, p0.y, p1.x, p1.y);
      drawLine(kPoseColor, p2.x, p2.y, p1.x, p1.y);
      drawLine(kPoseColor, p3.x, p3.y, p1.x, p1.y);
    }

    function draw() {
      const updateRate = parseFloat(document.getElementById('updateRate').value) || 20.0;
      const kDrawInterval = 1.0 / updateRate;
      const tNow = window.performance.now() * 0.001; // Convert to seconds
      if (tNow - tLastDraw < kDrawInterval) return;
      tLastDraw = tNow;
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (visMsg && currentMapName !== visMsg.header.map) {
        // currentMapName = visMsg.header.map;
        // loadMap(visMsg.header.map);
      }
      drawGrid();
      drawMap();
      drawLaserScan();
      drawPoints();
      drawLines();
      drawArcs();
      drawTextAnnotations();
      if (mouseDown) {
        // console.log(mouseDownLoc);
        // console.log(curMouseLoc);
        p0 = canvasToWorld(mouseDownLoc);
        p1 = canvasToWorld(curMouseLoc);
        drawLine("#000000", p0.x, p0.y, p1.x, p1.y);
      }
      if (visMsg) drawPose(visMsg.header.robot_pose, 'rgb(0, 150, 0)');
    }

    function setColor(c) {
      ctx.fillStyle = `rgb(${c.r * 255},${c.g * 255},${c.b * 255})`;
    }

    function drawPoints() {
      if (visMsg === undefined) return;
      visMsg.points.forEach(function (p, i) {
        point = p.point;
        if (i < visMsg.header.num_local_points) {
          point = robotToMap(point);
        }
        drawPoint(p.color, point.x, point.y);
      });
    }

    function robotToMap(p) {
      if (visMsg === undefined ||
        visMsg.header === undefined ||
        visMsg.header.robot_pose === undefined) {
        return p;
      }
      let a = visMsg.header.robot_pose.theta;
      let c = Math.cos(a);
      let s = Math.sin(a);
      return {
        x: c * p.x - s * p.y + visMsg.header.robot_pose.x,
        y: s * p.x + c * p.y + visMsg.header.robot_pose.y
      };
    }

    function drawLines() {
      if (visMsg === undefined) return;
      // console.log(visMsg.lines);
      visMsg.lines.forEach(function (l, i) {
        let p0 = l.p0;
        let p1 = l.p1;
        if (i < visMsg.header.num_local_lines) {
          p0 = robotToMap(p0);
          p1 = robotToMap(p1);
        }
        drawLine(l.color, p0.x, p0.y, p1.x, p1.y);
      });
    }

    function drawTextAnnotations() {
      if (visMsg == undefined) return;
      visMsg.textAnnotations.forEach(function (m, i) {
        let p = m.start;
        if (i < visMsg.header.num_local_text_annotations) {
          p = robotToMap(p);
        }
        drawTextAnnotation(m.str, p.x, p.y, m.color, m.size_em);
      });
    }

    function drawArcs() {
      if (visMsg === undefined) return;
      // console.log(visMsg.arcs);
      visMsg.arcs.forEach(function (a, i) {
        let center = a.center;
        let theta0 = a.start_angle;
        let theta1 = a.end_angle;
        if (i < visMsg.header.num_local_arcs) {
          center = robotToMap(center);
          theta0 += visMsg.header.robot_pose.theta;
          theta1 += visMsg.header.robot_pose.theta;
        }
        drawArc(a.color, center.x, center.y, a.radius, theta0, theta1);
      });
    }

    function drawArc(color, x, y, r, a0, a1) {
      ctx.strokeStyle = color;
      const p = worldToCanvas({ x: x, y: y });
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * scale, -a0, -a1, true);
      ctx.stroke();
    }

    function angleMod(angle) {
      angle -= 2 * Math.PI * Math.round(angle / (2 * Math.PI));
      return angle;
    }

    function drawPathOption(color, o, drawClearance) {
      console.log('drawing path option');
      if (Math.abs(o.curvature) < 1e-4) {
        // Straight line.
        let p0 = { x: 0, y: 0 };
        let p1 = { x: o.distance, y: 0 };
        let a = 0;
        if (robotPose !== undefined) {
          p0 = robotPose;
          a = robotPose.theta;
          let c = Math.cos(robotPose.theta);
          let s = Math.sin(robotPose.theta);
          let d = o.distance;
          p1 = { x: robotPose.x + d * c, y: robotPose.y + d * s };
        }
        drawLine(color, p0.x, p0.y, p1.x, p1.y);
        if (drawClearance) {
          let c = Math.cos(a);
          let s = Math.sin(a);
          let d = o.clearance;
          drawLine(color,
            p0.x - s * d, p0.y + c * d,
            p1.x - s * d, p1.y + c * d);
          drawLine(color,
            p0.x + s * d, p0.y - c * d,
            p1.x + s * d, p1.y - c * d);
        }
        return;
      }
      let r = 1 / o.curvature;
      let center = {
        x: 0,
        y: r
      };
      let a0 = (r > 0) ?
        (-Math.PI / 2) :
        (Math.PI / 2 + o.distance * o.curvature);
      let a1 = (r > 0) ?
        (-Math.PI / 2 + o.distance * o.curvature) :
        (Math.PI / 2);
      if (robotPose) {
        center = {
          x: robotPose.x - r * Math.sin(robotPose.theta),
          y: robotPose.y + r * Math.cos(robotPose.theta)
        };
        a0 = angleMod(a0 + robotPose.theta);
        a1 = angleMod(a1 + robotPose.theta);
      }
      // console.log(`${a0}, ${a1}`);
      drawArc(color, center.x, center.y, Math.abs(r), a0, a1);
      if (drawClearance) {
        if (Math.abs(r) - o.clearance > 0) {
          drawArc(color, center.x, center.y, Math.abs(r) - o.clearance, a0, a1);
        }
        drawArc(color, center.x, center.y, Math.abs(r) + o.clearance, a0, a1);
      }
    }

    function drawPathOptions() {
      if (visMsg === undefined) return;
      visMsg.path_options.forEach(function (o) {
        drawPathOption("#c0c0c0", o, false);
      });
      if (visMsg.path_options.length > 0) {
        let bestOption = visMsg.path_options[visMsg.path_options.length - 1];
        drawPathOption("#1000FF", bestOption, true);
      }
    }


    function drawMarkerLineList(m) {
      let individualColors = false;
      if (m.points.length === m.colors.length) {
        individualColors = true;
      } else {
        setColor(m.color);
      }
      let c = `rgb(${m.color.r * 255},${m.color.g * 255},${m.color.b * 255})`;
      for (let i = 0; i < m.points.length; i += 2) {
        let p0 = m.points[i];
        let p1 = m.points[i + 1];
        if (individualColors) {
          c = `rgb(${m.colors[i].r * 255},${m.colors[i].g * 255},${m.colors[i].b * 255})`;
        }
        drawLine(c, p0.x, p0.y, p1.x, p1.y);
      }
    }

    function drawLaserScan() {
      if (!lastLaserScan) return;
      let offset = { x: 0, y: 0, theta: 0 };
      if (robotPose) {
        // Configurable laser offset on the robot
        const laserOffset = parseFloat(document.getElementById('laserOffset').value) || 0.2;
        offset = {
          x: robotPose.x + laserOffset * Math.cos(robotPose.theta),
          y: robotPose.y + laserOffset * Math.sin(robotPose.theta),
          theta: robotPose.theta
        };
      }
      // Update map and draw line being made.
      // ctx.strokeStyle = 'rgba(82, 125, 232, 1)';
      // ctx.lineWidth = 2;
      const da = (lastLaserScan.angle_max - lastLaserScan.angle_min) /
        lastLaserScan.ranges.length;
      for (let i = 0; i < lastLaserScan.ranges.length; ++i) {
        const r = lastLaserScan.ranges[i];
        if (r === 0) continue;
        const a = lastLaserScan.angle_min + i * da + offset.theta;
        const x = Math.cos(a) * r + offset.x;
        const y = Math.sin(a) * r + offset.y;
        drawPoint("#eb8334", x, y);
      }
    }

    function drawGrid() {
      const D = 50 * scale;
      const d = 2 * scale;
      ctx.strokeStyle = "#d1d1d1";
      ctx.beginPath();
      ctx.lineWidth = 1;
      for (let i = -D; i < D; i += d) {
        ctx.moveTo(i + origin.x, -D + origin.y);
        ctx.lineTo(i + origin.x, D + origin.y);
        ctx.moveTo(-D + origin.x, i + origin.y);
        ctx.lineTo(D + origin.x, i + origin.y);
      }
      ctx.stroke();

      ctx.lineWidth = 4;
      drawLine("#EF0000", 0, 0, 1.5, 0);
      drawLine("#00AF00", 0, 0, 0, 1.5);
    }
  </script>
